name: Setup
description: Install Bun, restore the Turborepo cache, and install dependencies. Caller must run actions/checkout first.
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # Single source of truth: the packageManager field in root
        # package.json, so CI follows Dependabot's bumps automatically.
        bun-version-file: package.json

    # Node runs everything whose bin says `#!/usr/bin/env node` (vitest,
    # storybook, playwright) — including the coverage run, since V8 coverage
    # works only on Node. Taken from .tool-versions so CI measures on the same
    # major a developer does; the runner image's own Node is a different one,
    # and the coverage ratchet is floored locally and enforced here.
    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .tool-versions

    - name: Restore Turborepo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
