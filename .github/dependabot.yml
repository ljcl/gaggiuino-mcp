version: 2
# Every ecosystem waits `cooldown` days before proposing a version. Patch and
# minor bumps auto-merge once CI passes (dependabot-auto-merge.yml), usually
# within three minutes of opening, so CI is the only review a fresh release
# gets. Three days lets a compromised or broken publish be yanked before it
# arrives. Security updates are never delayed by it.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # fix(deps), not chore(deps): production deps ship inside the published
    # Docker image (server runtime plus the bundled MCP App HTML), so a bump
    # must cut a patch release or users never receive it. Dev-only tooling
    # stays chore(deps) and produces no release. The groups are split by
    # dependency-type so a grouped PR never mixes the two prefixes.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    reviewers:
      - ljcl

  - package-ecosystem: github-actions
    # For github-actions, "/" means .github/workflows plus an action.yml in the
    # repository root — nothing else. A composite action nested under
    # .github/actions is its own manifest and goes unwatched: setup's pins had
    # drifted a full major behind the same action in ci.yml before this. Only
    # `directories` supports the wildcard, which keeps a future composite
    # action covered from the day it lands.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    reviewers:
      - ljcl

  - package-ecosystem: docker
    directory: "/apps/server"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # fix(deps) for the same reason as npm: base-image bumps only reach users
    # via a new release publishing a fresh image.
    commit-message:
      prefix: "fix(deps)"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    reviewers:
      - ljcl
