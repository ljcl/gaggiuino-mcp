name: CodeQL

# Static analysis for the TypeScript workspace. Alerts land in the Security
# tab; this is a signal, not a merge gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 7 * * 4" # weekly, catches new queries against unchanged code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # Required on PRIVATE repos: the analyze step reads workflow-run metadata
      # when uploading SARIF, and fails with "Resource not accessible by
      # integration" without it. Public repos get this implicitly, which is why
      # the equivalent workflow in a public sibling repo does not need it.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:javascript-typescript"
