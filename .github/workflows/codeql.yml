name: CodeQL

# Static analysis for the TypeScript workspace and for the workflows
# themselves. Alerts land in the Security tab; this is a signal, not a merge
# gate. The `actions` language is what flags a privileged pull_request_target
# job checking out and running PR code — the shape dependabot-autofix.yml is
# split into two jobs to avoid.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 7 * * 4" # weekly, catches new queries against unchanged code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    permissions:
      contents: read
      security-events: write
      # Required on PRIVATE repos: the analyze step reads workflow-run metadata
      # when uploading SARIF, and fails with "Resource not accessible by
      # integration" without it. Public repos get this implicitly, which is why
      # the equivalent workflow in a public sibling repo does not need it.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
