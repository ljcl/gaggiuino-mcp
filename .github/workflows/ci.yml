name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 3" # weekly audit run, surfaces new advisories between PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # CI installs Bun from root package.json's packageManager (see the setup
      # composite) while the published image is built on the Dockerfile's
      # oven/bun base tags, so a skew silently tests on a different runtime than
      # the one that ships. Dependabot's docker ecosystem only bumps the image
      # side, so the drift would otherwise grow unnoticed. .tool-versions is
      # what a developer's asdf/mise installs, so it is held to the same pin.
      - name: Bun version skew
        run: |
          want=$(bun --print 'require("./package.json").packageManager.replace("bun@", "")')
          have=$(sed -n 's|^FROM oven/bun:\([0-9][^ -]*\).*|\1|p' apps/server/Dockerfile | sort -u)
          if [ "$have" != "$want" ]; then
            echo "::error::Bun version skew: package.json pins bun@$want, apps/server/Dockerfile pins $(echo "$have" | tr '\n' ' ')— bump packageManager to match the image."
            exit 1
          fi
          local=$(sed -n 's/^bun[[:space:]]\{1,\}//p' .tool-versions)
          if [ "$local" != "$want" ]; then
            echo "::error file=.tool-versions::Bun version skew: package.json pins bun@$want, .tool-versions pins bun ${local:-<none>} — set it to $want."
            exit 1
          fi
          echo "Bun $want in package.json, apps/server/Dockerfile and .tool-versions."

      # Biome runs outside turbo here (unlike the local `check` task) so its
      # GitHub reporter's ::error/::warning workflow commands start the line —
      # turbo's task-name prefix would stop GitHub parsing them. This is what
      # surfaces diagnostics as inline annotations on the PR diff, including
      # warn-level rules that never fail the build.
      - name: Lint
        run: bun run lint --reporter=github

      - name: Check (PR — affected only)
        if: github.event_name == 'pull_request'
        run: |
          bun run turbo run test typecheck build knip --affected
          bun run turbo boundaries

      - name: Check (main — full)
        if: github.event_name == 'push'
        run: |
          bun run turbo run test typecheck build knip
          bun run turbo boundaries

      # Story smoke tests: every Storybook story renders in real headless
      # Chromium via the Vitest addon. This is the automated UI gate;
      # runs after the unit-test check, coverage below is unaffected.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun --print 'require("./package.json").devDependencies.playwright')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      # With coverage: the same story smoke tests, plus a measure of which
      # packages/* source the stories execute in the browser. The
      # summary row lands in the coverage table below.
      - name: Story tests
        run: bun run turbo run test:stories:coverage

      # Coverage is computed on every run and surfaced in the job summary,
      # so test-depth regressions are visible at review time.
      - name: Coverage
        run: bun run turbo run test:coverage

      # Restore the latest main coverage snapshot into coverage-baseline/ so the
      # summary can annotate each moved cell with its delta vs main.
      # Best-effort: on a PR the primary key cannot hit (it is stamped with the
      # ephemeral merge SHA, and the only writer of that key is the push-gated
      # save below), so the restore-keys prefix picks the most recent saved
      # baseline. With no baseline the table degrades to absolute numbers —
      # which happens on the first main run and after an entry is evicted.
      # Fork PRs are NOT such a case: they can read caches from the base
      # branch, they just cannot write one, and the save step never runs on a
      # PR anyway.
      - name: Restore coverage baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage-baseline
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-

      - name: Publish coverage summary
        run: bun run coverage:summary >> "$GITHUB_STEP_SUMMARY"

      # On main, replace the baseline with this run's coverage and persist it so
      # the next PR diffs against it. Rebuilt from scratch (not the restored
      # copy) so a package that stops emitting coverage drops out of the baseline
      # too. Cached with a SHA-stamped key because cache entries are immutable.
      - name: Stage coverage baseline
        if: github.event_name == 'push'
        run: |
          rm -rf coverage-baseline
          for f in apps/*/coverage/coverage-summary.json \
                   packages/*/coverage/coverage-summary.json \
                   coverage-stories/coverage-summary.json; do
            [ -f "$f" ] || continue
            mkdir -p "coverage-baseline/$(dirname "$f")"
            cp "$f" "coverage-baseline/$f"
          done

      - name: Save coverage baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage-baseline
          key: coverage-baseline-${{ github.sha }}

      # Bundle size budget for the MCP App. The build is requested explicitly
      # because the PR path above runs `--affected`, which legitimately skips
      # shot-graph on a PR that does not touch it — and a size gate that
      # silently no-ops is not a gate. It is a turbo cache hit in that case.
      # --strict therefore makes a missing artifact an error rather than a
      # notice. Run outside turbo so the markdown reaches the job summary
      # without a task-name prefix on every line.
      - name: Bundle size
        run: |
          set -o pipefail
          bun run turbo run build --filter=@gaggiuino/shot-graph
          bun run size --strict | tee -a "$GITHUB_STEP_SUMMARY"

      # Informational dead-code readout beside the turbo `knip` gate above (a
      # green build already means zero issues). Re-runs the analysis with the
      # JSON reporter; --no-exit-code plus the script's always-zero exit keep it
      # from ever failing the build.
      - name: Knip summary
        if: ${{ !cancelled() }}
        run: |
          bun run knip --reporter json --no-exit-code 2>/dev/null \
            | bun scripts/knip-summary.ts >> "$GITHUB_STEP_SUMMARY" || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Audit dependencies (high severity and above)
        # Advisory on PRs and main pushes: a new advisory against an unrelated
        # transitive dep should not block unrelated work. The weekly scheduled
        # run DOES fail on findings, and `audit-issue` below turns that failure
        # into a tracking issue.
        #
        # That only works while the scheduled run is normally green, which is
        # what .github/audit-ignore.txt is for: an accepted advisory is listed
        # there with a reason and a review date, instead of being left to hold
        # the run red. A gate that is always red reports nothing new.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          set +e
          today=$(date -u +%F)
          args=()
          while read -r id review _; do
            case "$id" in ''|'#'*) continue ;; esac
            if [[ "$review" < "$today" || "$review" == "$today" ]]; then
              echo "::warning file=.github/audit-ignore.txt::$id passed its review date ($review); it is no longer ignored."
            else
              args+=("--ignore=$id")
            fi
          done < .github/audit-ignore.txt
          bun audit --audit-level=high "${args[@]}" > audit.txt 2>&1
          status=$?
          cat audit.txt
          { echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Keep the report for the tracking issue
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-report
          path: audit.txt
          retention-days: 7

  # Turns the scheduled audit's result into one tracking issue: opened (or
  # commented on) while it fails, closed when it passes again. A red run on a
  # schedule notifies nobody reliably, which is how eight of them went unread.
  #
  # Separate from `audit` so `issues: write` is held by a job that runs no
  # dependency code: it reads the report as data and calls `gh`, nothing else.
  audit-issue:
    needs: [audit]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: audit-report

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly dependency audit is failing"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ "$RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "The scheduled audit passed again: $RUN_URL"
            fi
            exit 0
          fi
          {
            echo "The scheduled \`bun audit --audit-level=high\` run failed: $RUN_URL"
            echo
            echo "Run \`bun audit fix\` and commit \`bun.lock\`. If no in-range fix exists, accept the advisory in \`.github/audit-ignore.txt\` with a reason and a review date."
            echo
            echo '```'
            if [ -f audit.txt ]; then cat audit.txt; else echo "(no report: the audit job failed before it ran)"; fi
            echo '```'
          } > body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md --label "type:chore" --label "area:ci-release"
          fi
