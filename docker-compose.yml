services:
  gaggiuino-mcp:
    # Published multi-arch image (linux/amd64, linux/arm64) from GHCR.
    # `latest` is the newest release. Set GAGGIUINO_MCP_TAG to pin one (e.g.
    # 5.0.0 or 5.0) instead. To build from source, see docker-compose.build.yml.
    image: ghcr.io/ljcl/gaggiuino-mcp:${GAGGIUINO_MCP_TAG:-latest}
    container_name: gaggiuino-mcp
    network_mode: host
    restart: unless-stopped
    # The server persists nothing and needs no privilege: its code is
    # root-owned and read-only to it, it binds an unprivileged port, and it
    # never changes user. So the filesystem is read-only, every capability is
    # dropped, and setuid binaries cannot raise it back.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      # Put MCP_PUBLIC_URL, MCP_OAUTH_SECRET and MCP_OAUTH_PASSPHRASE_HASH here
      # before exposing this through a tunnel — without them /mcp is
      # unauthenticated (see README > Securing the endpoint).
      #
      # AFTER EDITING THESE FILES, RECREATE THE CONTAINER:
      #   docker compose up -d --force-recreate
      # A plain `up -d` or `restart` can reuse the existing container, which
      # keeps the environment it was created with — so the new variables never
      # reach the process and the server comes up unauthenticated as if you had
      # not set them. Compose tracks the env_file *list*, not its contents.
      #
      # `.env` first so a standalone deploy (this file alone, no repo checkout)
      # works; `apps/server/.env` keeps existing repo-based setups working.
      - path: .env
        required: false
      - path: apps/server/.env
        required: false
    # Personal `*.local.yaml` overrides are deliberately never baked into the
    # published image. Mount them read-only to use them (see README > Customization).
    # volumes:
    #   - ./profiles.local.yaml:/app/apps/server/src/data/profiles.local.yaml:ro
    #   - ./prompts.local.yaml:/app/apps/server/src/data/prompts.local.yaml:ro
